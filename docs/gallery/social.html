<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player Statuses social preview</title>
<style>
  /* The 1280x640 social preview of the GitHub repository: the name on the left, three players on the
     right with dark-slate status pills above their heads. ?h=400 gives the wide README banner, ?h=720 the
     16:9 version for store galleries. Rendered by make-banners.js. */
  @font-face {
    font-family: "Inter";
    src: url("fonts/Inter-latin.woff2") format("woff2");
    font-weight: 100 900;
  }
  :root {
    --bg: #141929;
    --bg-deep: #0b0e18;
    --accent: #58a6ff;
    --amber: #ffca28;
    --gold: #e09f3e;
    --text: #f5f7fa;
    --dim: #9ba5be;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "Inter", sans-serif;
    color: var(--text);
    background:
      radial-gradient(680px 460px at 77% 46%, rgba(88, 166, 255, 0.18), transparent 72%),
      radial-gradient(560px 400px at -5% 108%, rgba(88, 166, 255, 0.10), transparent 70%),
      linear-gradient(155deg, var(--bg) 0%, var(--bg-deep) 100%);
    -webkit-font-smoothing: antialiased;
  }
  canvas { position: absolute; left: 0; top: 0; }
  .left { position: absolute; left: 64px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
  .head { display: flex; align-items: center; gap: 20px; }
  .head img { width: 80px; height: 80px; image-rendering: pixelated; }
  .for { font-size: 21px; font-weight: 600; color: var(--accent); letter-spacing: 0.01em; line-height: 1.3; }
  h1 { font-size: 80px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin-top: 26px; }
  .line { font-size: 29px; font-weight: 500; color: #d6deee; line-height: 1.28; margin-top: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .chip {
    font-size: 17px; font-weight: 600; padding: 7px 14px; border-radius: 999px;
    background: rgba(88, 166, 255, 0.12); border: 1px solid rgba(88, 166, 255, 0.36); color: #e4eeff;
  }
  .loaders { margin-top: 26px; font-size: 19px; color: var(--dim); }
  .loaders b { color: var(--text); font-weight: 600; }
  body.wide .head, body.wide .chips { display: none; }
  body.wide h1 { margin-top: 0; font-size: 74px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="left">
  <div class="head"><img src="../../icon.png" alt=""><div class="for">Typing, AFK &amp; open screen<br>indicators for multiplayer</div></div>
  <h1>Player Statuses</h1>
  <div class="line">See what other players are up to.</div>
  <div class="chips"><span class="chip">Typing…</span><span class="chip">Inventory</span><span class="chip">Containers</span><span class="chip">AFK timer</span><span class="chip">Tabbed out</span></div>
  <div class="loaders"><b>Fabric · Quilt · Forge · NeoForge · Paper</b> &nbsp; 1.16.5 – 26.3</div>
</div>
<script>
  const H = Number(new URLSearchParams(location.search).get("h")) || 640;
  if (H < 500) document.body.classList.add("wide");
  document.documentElement.style.height = document.body.style.height = H + "px";
  const canvas = document.getElementById("c"), dpr = window.devicePixelRatio || 1;
  canvas.width = 1280 * dpr; canvas.height = H * dpr;
  canvas.style.width = "1280px"; canvas.style.height = H + "px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.imageSmoothingEnabled = false;

  function head(x, y, size, skin, hair, shirt) {
    const t = size / 8;
    const face = [
      "hhhhhhhh",
      "hhhhhhhh",
      "hssssssh",
      "ssssssss",
      "sweswess",
      "ssssssss",
      "ssmmmmss",
      "ssssssss"];
    face.forEach((row, r) => [...row].forEach((c, k) => {
      ctx.fillStyle = { h: hair, s: skin, w: "#ffffff", e: "#2d3150", m: "#a06a4a" }[c];
      ctx.fillRect(x + k * t, y + r * t, t + 0.5, t + 0.5);
    }));
    ctx.fillStyle = shirt;
    ctx.beginPath();
    ctx.roundRect(x - size * 0.2, y + size + 8, size * 1.4, size * 0.78, [16, 16, 0, 0]);
    ctx.fill();
  }

  function statusPill(cx, bottom, w, h, accentColor) {
    const x0 = Math.round(cx - w / 2);
    const y0 = Math.round(bottom - h);
    ctx.save();
    ctx.shadowColor = "rgba(0, 0, 0, 0.45)";
    ctx.shadowBlur = 18;
    ctx.shadowOffsetY = 5;
    ctx.fillStyle = "#10131c";
    ctx.beginPath();
    ctx.roundRect(x0, y0, w, h, 10);
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = "#2b3348";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(x0 + 1, y0 + 1, w - 2, h - 2, 9);
    ctx.stroke();

    ctx.fillStyle = accentColor;
    ctx.beginPath();
    ctx.roundRect(x0, y0, 6, h, [10, 0, 0, 10]);
    ctx.fill();
    return { x0, y0 };
  }

  document.fonts.load("700 22px Inter").then(draw);
  function draw() {
    const size = H < 500 ? 88 : 98;
    const base = H < 500 ? H / 2 + 54 : H / 2 + 72;
    const players = [
      { x: 745, skin: "#e0ae84", hair: "#4a3426", shirt: "#3aa79f" },
      { x: 935, skin: "#c98d63", hair: "#1f1b1b", shirt: "#6b5cd6" },
      { x: 1130, skin: "#f1c7a0", hair: "#d9a441", shirt: "#cf5648" }
    ];
    players.forEach(p => head(p.x - size / 2, base - size / 2, size, p.skin, p.hair, p.shirt));

    const pillBottom = base - size / 2 - 18;
    const pillH = 48;

    // 1. Typing... pill
    const p1 = statusPill(745, pillBottom, 168, pillH, "#4fc3f7");
    const bx = p1.x0 + 16, by = p1.y0 + 12;
    ctx.fillStyle = "#4fc3f7";
    ctx.fillRect(bx + 2, by, 20, 18);
    ctx.fillRect(bx, by + 2, 24, 14);
    ctx.fillRect(bx + 5, by + 18, 6, 5);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(bx + 4, by + 7, 4, 4);
    ctx.fillRect(bx + 10, by + 7, 4, 4);
    ctx.fillStyle = "#7ce0ff";
    ctx.fillRect(bx + 16, by + 6, 4, 5);
    ctx.fillStyle = "#f5f7fa";
    ctx.font = "700 22px Inter";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText("Typing…", bx + 32, p1.y0 + pillH / 2 + 1);

    // 2. Chest / Container pill
    const p2 = statusPill(935, pillBottom, 174, pillH, "#e09f3e");
    const cx = p2.x0 + 16, cy = p2.y0 + 12;
    ctx.fillStyle = "#5c3811"; ctx.fillRect(cx, cy, 24, 24);
    ctx.fillStyle = "#e09f3e"; ctx.fillRect(cx + 2, cy + 2, 20, 8); ctx.fillRect(cx + 2, cy + 12, 20, 10);
    ctx.fillStyle = "#ffd54f"; ctx.fillRect(cx + 10, cy + 8, 4, 6);
    ctx.fillStyle = "#f5f7fa";
    ctx.fillText("Container", cx + 32, p2.y0 + pillH / 2 + 1);

    // 3. AFK 12m pill (generous width so text never clips)
    const p3 = statusPill(1130, pillBottom, 176, pillH, "#ffca28");
    const ax = p3.x0 + 16, ay = p3.y0 + 12;
    ctx.fillStyle = "#ffca28";
    ctx.fillRect(ax + 4, ay + 2, 8, 2);
    ctx.fillRect(ax + 2, ay + 4, 6, 14);
    ctx.fillRect(ax + 4, ay + 18, 10, 4);
    ctx.fillStyle = "#fff8e1";
    ctx.font = "800 13px Inter";
    ctx.fillText("zz", ax + 13, ay + 8);
    ctx.fillStyle = "#f5f7fa";
    ctx.font = "700 22px Inter";
    ctx.fillText("AFK 12m", ax + 32, p3.y0 + pillH / 2 + 1);
  }
</script>
</body>
</html>
