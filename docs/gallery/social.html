<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player Statuses social preview</title>
<style>
  /* The 1280x640 social preview of the GitHub repository: the name on the left, three players on the
     right with what they are doing above their heads. ?h=400 gives the wide README banner, ?h=720 the
     16:9 version for the store galleries. Rendered by make-banners.js. */
  @font-face {
    font-family: "Inter";
    src: url("fonts/Inter-latin.woff2") format("woff2");
    font-weight: 100 900;
  }
  :root {
    --bg: #1a1e33;
    --bg-deep: #0e1020;
    --accent: #7c8cff;
    --amber: #ffc857;
    --mint: #5ee0a0;
    --text: #f2f3fb;
    --dim: #a7acc8;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "Inter", sans-serif;
    color: var(--text);
    background:
      radial-gradient(700px 480px at 76% 46%, rgba(124, 140, 255, 0.20), transparent 70%),
      radial-gradient(600px 420px at -5% 110%, rgba(124, 140, 255, 0.09), transparent 70%),
      linear-gradient(160deg, var(--bg) 0%, var(--bg-deep) 100%);
    -webkit-font-smoothing: antialiased;
  }
  canvas { position: absolute; left: 0; top: 0; }
  .left { position: absolute; left: 68px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .head { display: flex; align-items: center; gap: 22px; }
  .head img { width: 84px; height: 84px; image-rendering: pixelated; }
  .for { font-size: 22px; font-weight: 600; color: var(--accent); letter-spacing: 0.02em; line-height: 1.3; }
  h1 { font-size: 84px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin-top: 28px; }
  .line { font-size: 31px; font-weight: 500; color: #d6d9ee; line-height: 1.25; margin-top: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
  .chip {
    font-size: 18px; font-weight: 600; padding: 7px 14px; border-radius: 999px;
    background: rgba(124, 140, 255, 0.13); border: 1px solid rgba(124, 140, 255, 0.38); color: #e2e6ff;
  }
  .loaders { margin-top: 28px; font-size: 20px; color: var(--dim); }
  .loaders b { color: var(--text); font-weight: 600; }
  /* The wide banner keeps the name and one line */
  body.wide .head, body.wide .chips { display: none; }
  body.wide h1 { margin-top: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="left">
  <div class="head"><img src="../../icon.png" alt=""><div class="for">Typing, AFK &amp; open screen<br>indicators for multiplayer</div></div>
  <h1>Player Statuses</h1>
  <div class="line">See what other players are up to.</div>
  <div class="chips"><span class="chip">Typing…</span><span class="chip">Inventory</span><span class="chip">Chests</span><span class="chip">AFK timer</span><span class="chip">Tabbed out</span></div>
  <div class="loaders"><b>Fabric · Quilt · Forge · NeoForge · Paper</b> &nbsp; 1.20.1 – 26.x</div>
</div>
<script>
  const H = Number(new URLSearchParams(location.search).get("h")) || 640;
  if (H < 500) document.body.classList.add("wide");
  document.documentElement.style.height = document.body.style.height = H + "px";
  const canvas = document.getElementById("c"), dpr = window.devicePixelRatio || 1;
  canvas.width = 1280 * dpr; canvas.height = H * dpr;
  canvas.style.width = "1280px"; canvas.style.height = H + "px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.imageSmoothingEnabled = false;

  // A Minecraft-like head: an 8x8 face of texels
  function head(x, y, size, skin, hair, shirt) {
    const t = size / 8;
    const face = [
      "hhhhhhhh",
      "hhhhhhhh",
      "hssssssh",
      "ssssssss",
      "sweswess",
      "ssssssss",
      "ssmmmmss",
      "ssssssss"];
    face.forEach((row, r) => [...row].forEach((c, k) => {
      ctx.fillStyle = { h: hair, s: skin, w: "#ffffff", e: "#2d3150", m: "#a06a4a" }[c];
      ctx.fillRect(x + k * t, y + r * t, t + 0.5, t + 0.5);
    }));
    // Shoulders, narrower than the gap between two players
    ctx.fillStyle = shirt;
    ctx.beginPath();
    ctx.roundRect(x - size * 0.2, y + size + 8, size * 1.4, size * 0.8, [18, 18, 0, 0]);
    ctx.fill();
  }

  // A rounded bubble with a tail, centred above (cx, bottom)
  function bubble(cx, bottom, w, h, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(cx - w / 2, bottom - h, w, h, 16);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 12, bottom - 1);
    ctx.lineTo(cx + 12, bottom - 1);
    ctx.lineTo(cx, bottom + 14);
    ctx.fill();
  }

  // The canvas text needs Inter loaded first
  document.fonts.load("800 30px Inter").then(draw);
  function draw() {
  const base = H / 2 + 70;
  const size = 104;
  const players = [
    { x: 760, skin: "#e0ae84", hair: "#4a3426", shirt: "#3aa79f" },
    { x: 940, skin: "#c98d63", hair: "#1f1b1b", shirt: "#7c5cd6" },
    { x: 1120, skin: "#f1c7a0", hair: "#d9a441", shirt: "#d0574a" }];
  players.forEach(p => head(p.x - size / 2, base - size / 2, size, p.skin, p.hair, p.shirt));

  ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
  ctx.shadowBlur = 18;
  // Typing: three dots
  bubble(760, base - size / 2 - 22, 128, 64, "#f4f5fc");
  ctx.shadowBlur = 0;
  ["#7c8cff", "#7c8cff", "#7c8cff"].forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.globalAlpha = 0.45 + 0.27 * i;
    ctx.fillRect(760 - 40 + i * 30, base - size / 2 - 22 - 42, 20, 20);
  });
  ctx.globalAlpha = 1;
  // A chest
  ctx.shadowBlur = 18;
  bubble(940, base - size / 2 - 22, 92, 74, "#f4f5fc");
  ctx.shadowBlur = 0;
  const cx = 940 - 26, cy = base - size / 2 - 22 - 62;
  ctx.fillStyle = "#8a5a2b"; ctx.fillRect(cx, cy, 52, 46);
  ctx.fillStyle = "#a8743c"; ctx.fillRect(cx + 4, cy + 4, 44, 14); ctx.fillRect(cx + 4, cy + 22, 44, 20);
  ctx.fillStyle = "#3b2a1a"; ctx.fillRect(cx, cy + 18, 52, 4);
  ctx.fillStyle = "#cfd3dc"; ctx.fillRect(cx + 22, cy + 14, 8, 12);
  // AFK with its timer
  ctx.shadowBlur = 18;
  bubble(1120, base - size / 2 - 22, 176, 64, "#2a2f52");
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#ffc857";
  ctx.font = "800 30px Inter";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("Zz  AFK 12m", 1120, base - size / 2 - 22 - 32);
  }
</script>
</body>
</html>
