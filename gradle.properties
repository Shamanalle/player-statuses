# Gradle
org.gradle.jvmargs=-Xmx3G
# JDK 17 for the Java 8 build of the common code (gradle/jabel.gradle), found on the runner or downloaded
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
# Set up only the modules a task needs: the loader plugins prepare Minecraft for each module while
# configuring, so ':common:test' or one module's build would otherwise wait for all of them
org.gradle.configureondemand=true
# ForgeGradle 7 (the forge-1.21.10 ... forge-26 modules), as in Forge's own example project
net.minecraftforge.gradle.merge-source-sets=true

# Mod
mod_version=0.1.0
maven_group=com.kasper.playerstatuses

# Shared dependencies
slf4j_version=2.0.16
# Simple Voice Chat API (optional: microphone and sound state)
voicechat_api_version=2.6.13

# Bukkit / Spigot / Paper / Purpur / Folia plugin (server side only, Java 17 bytecode)
bukkit_api_version=1.20.1-R0.1-SNAPSHOT

# --- Fabric / Quilt -------------------------------------------------------------------------------
# Minecraft 1.21.9 - 1.21.10 (Java 21) - compiled against 1.21.10
mc12110_minecraft=1.21.10
mc12110_fabric_loader=0.17.3
mc12110_fabric_api=0.138.4+1.21.10
# Minecraft 1.21.11 (Java 21)
mc12111_minecraft=1.21.11
mc12111_fabric_loader=0.18.4
mc12111_fabric_api=0.141.6+1.21.11
# Minecraft 26.1 - 26.3 (Java 25, unobfuscated) - compiled against 26.3, runs on 26.1 - 26.3
# (checked on every 26.x release by .github/workflows/compat-26.yml)
mc26_minecraft=26.3
mc26_fabric_loader=0.19.5
mc26_fabric_api=0.164.0+26.3

# --- Forge ----------------------------------------------------------------------------------------
# Each band is compiled against the version below and, by .github/workflows/build.yml, against the
# oldest one of the band (_oldest). The in-game tests start servers with both.
# Forge 1.20.1 (Minecraft 1.20 - 1.20.1, runs with Forge's SRG names: remapped by reobfJar)
forge120_version=1.20.1-47.4.28
forge120_version_oldest=1.20-46.0.14
# NeoForge for 1.20.1 is a fork of Forge and loads the Forge 1.20.1 jar (net.neoforged:forge)
nf1201_forge=1.20.1-47.1.106
# Forge 1.21.9 - 1.21.10
forge12110_version=1.21.10-60.1.18
forge12110_version_oldest=1.21.9-59.0.5
# Forge 1.21.11
forge12111_version=1.21.11-61.2.4
forge12111_version_oldest=1.21.11-61.0.0
# Forge 26.1 - 26.3
forge26_version=26.3-66.0.13
forge26_version_oldest=26.1-62.0.9

# --- NeoForge -------------------------------------------------------------------------------------
# NeoForge 1.21 - 1.21.1
nf121_neoforge=21.1.264
nf121_neoforge_oldest=21.0.167
# NeoForge 1.21.9 - 1.21.10
nf12110_neoforge=21.10.64
nf12110_neoforge_oldest=21.9.16-beta
# NeoForge 1.21.11
nf12111_neoforge=21.11.48
nf12111_neoforge_oldest=21.11.0-beta
# NeoForge 26.1 - 26.3
nf26_neoforge=26.3.0.95
nf26_neoforge_oldest=26.1.2.122
