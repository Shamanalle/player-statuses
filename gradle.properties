# Gradle
org.gradle.jvmargs=-Xmx3G
# JDK 17 for the Java 8 build of the common code (gradle/jabel.gradle), found on the runner or downloaded
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
# Set up only the modules a task needs: the loader plugins prepare Minecraft for each module while
# configuring, so ':common:test' or one module's build would otherwise wait for all of them
org.gradle.configureondemand=true
# ForgeGradle 7 (the forge-1.21.10 ... forge-26 modules), as in Forge's own example project
net.minecraftforge.gradle.merge-source-sets=true

# Mod
mod_version=1.0.0
maven_group=com.kasper.playerstatuses

# Shared dependencies
slf4j_version=2.0.16
# Simple Voice Chat API (optional: microphone and sound state)
voicechat_api_version=2.6.13

# Bukkit / Spigot / Paper / Purpur / Folia plugin (server side only, Java 17 bytecode)
bukkit_api_version=1.20.1-R0.1-SNAPSHOT

