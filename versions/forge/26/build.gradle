plugins {
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
    id 'java'
}

// Forge, Minecraft 26.x (see gradle/forge-band.gradle)
ext.forgeTarget = 'mc26.x'
ext.forgeVersion = 'forge26_version'
ext.forgeShared = ['shared/forge-bus7', 'shared/mc-1.21.11-up', 'shared/mc-all']
apply from: "${rootDir}/gradle/forge-band.gradle"
