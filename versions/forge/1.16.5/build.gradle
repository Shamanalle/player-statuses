plugins {
    id 'java'
    id 'dev.architectury.loom' version '1.10.455'
}

// Forge 1.16.5: the code shared with the other builds is compiled here against Mojang's names and turned into
// Forge's runtime (SRG) names by remapJar. Minecraft 1.16.5 runs on Java 8, so the Java 17 sources (the common
// module included) are compiled to Java 8 bytecode with Jabel (gradle/jabel.gradle of the main build explains it).
def repoRoot = file('../../..')
def props = new Properties()
new File(repoRoot, 'gradle.properties').withInputStream { props.load(it) }

def forgeVersion = project.findProperty('loaderOverride') ?: props.getProperty('forge116_version')
def minecraftVersion = forgeVersion.substring(0, forgeVersion.indexOf('-'))
def modVersion = props.getProperty('mod_version')

version = "${modVersion}+mc1.16.5"
group = props.getProperty('maven_group')

base {
    archivesName = 'player-statuses-forge'
}

loom {
    silentMojangMappingsLicense()
}

repositories {
    mavenCentral()
}

apply from: "${repoRoot}/gradle/jabel.gradle"

def ownRoot = file('src/main/java')
def sharedRoots = [
        "${repoRoot}/shared/mc-1.16/src/main/java",
        "${repoRoot}/shared/mc-1.18/src/main/java",
        "${repoRoot}/shared/mc-1.19/src/main/java",
        "${repoRoot}/shared/mc-1.19.4/src/main/java",
        "${repoRoot}/shared/mc-1.20.1/src/main/java",
        "${repoRoot}/shared/mc-all/src/main/java",
        "${repoRoot}/common/src/main/java",
].collect { new File(it) }
def excluded = [
        'com/kasper/playerstatuses/network/StatusPayload.java',
]

sourceSets {
    stubs {
        java.srcDir "${repoRoot}/common/src/stubs/java"
    }
    main {
        compileClasspath += stubs.output
        java {
            sharedRoots.each { srcDir it }
            exclude { FileTreeElement e ->
                if (e.directory) {
                    return false
                }
                def path = e.relativePath.pathString
                def index = sharedRoots.findIndexOf { e.file.path.startsWith(it.path + File.separator) }
                if (index < 0) {
                    return false
                }
                def before = [ownRoot] + sharedRoots.take(index)
                excluded.contains(path) || before.any { new File(it, path).exists() }
            }
        }
        resources {
            srcDir "${repoRoot}/common/src/main/resources"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:${forgeVersion}"
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/mods.toml') {
        expand 'version': version
    }
    filesMatching('playerstatuses-build.properties') {
        expand 'version': modVersion
    }
}

remapJar {
    archiveClassifier = ''
}
