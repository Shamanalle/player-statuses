plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
    id 'java'
}

// Forge 1.17.1
evaluationDependsOn(':common-j8')

version = "${project.mod_version}+mc1.17.1"

base {
    archivesName = "player-statuses-forge"
}

repositories {
    mavenCentral()
}

legacyForge {
    version = project.findProperty("loaderOverride.${project.name}") ?: project.forge117_version
}

apply from: "${rootDir}/gradle/shared-sources.gradle"
useShared(['shared/mc-1.18', 'shared/mc-1.19', 'shared/mc-1.19.4', 'shared/mc-1.20.1', 'shared/mc-all'], ['com/kasper/playerstatuses/network/StatusPayload.java'])

dependencies {
    implementation project(':common-j8')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 16
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_16
    targetCompatibility = JavaVersion.VERSION_16
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

jar {
    from project(':common-j8').sourceSets.main.output
}
