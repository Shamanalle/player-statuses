plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
    id 'java'
}

// Forge 1.19 - 1.19.2
evaluationDependsOn(':common')

version = "${project.mod_version}+mc1.19.2"

base {
    archivesName = "player-statuses-forge"
}

repositories {
    mavenCentral()
}

legacyForge {
    version = project.findProperty("loaderOverride.${project.name}") ?: project.forge119_version
}

apply from: "${rootDir}/gradle/shared-sources.gradle"
useShared(['versions/forge/1.20.1', 'shared/mc-1.19', 'shared/mc-1.19.4', 'shared/mc-1.20.1', 'shared/mc-all'], ['com/kasper/playerstatuses/network/StatusPayload.java'])

dependencies {
    implementation project(':common')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
}
