plugins {
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
    id 'java'
}

// Forge, Minecraft 1.20.5-1.20.6 (see gradle/forge-band.gradle)
ext.forgeTarget = 'mc1.20.5-1.20.6'
ext.forgeVersion = 'forge1206_version'
ext.forgeShared = ['shared/forge-bus6', 'shared/mc-1.20.6', 'shared/mc-1.21.1', 'shared/mc-all']
apply from: "${rootDir}/gradle/forge-band.gradle"
