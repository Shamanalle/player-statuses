plugins {
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
    id 'java'
}

// Forge, Minecraft 1.21.6-1.21.8 (see gradle/forge-band.gradle)
ext.forgeTarget = 'mc1.21.6-1.21.8'
ext.forgeVersion = 'forge1218_version'
ext.forgeShared = ['shared/forge-bus7', 'shared/mc-1.21.8', 'shared/mc-all']
apply from: "${rootDir}/gradle/forge-band.gradle"
