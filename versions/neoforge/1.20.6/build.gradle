plugins {
    id 'net.neoforged.moddev' version '2.0.147'
    id 'java'
}

// NeoForge, Minecraft 1.20.5-1.20.6 (see gradle/neoforge-band.gradle)
ext.nfTarget = 'mc1.20.5-1.20.6'
