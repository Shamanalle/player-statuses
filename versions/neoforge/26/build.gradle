plugins {
    id 'net.neoforged.moddev' version '2.0.147'
    id 'java'
}

// NeoForge, Minecraft 26.x (see gradle/neoforge-band.gradle)
ext.nfTarget = 'mc26.x'
ext.nfVersion = 'nf26_neoforge'
ext.nfShared = ['shared/neoforge', 'shared/mc-1.21.11-up', 'shared/mc-all']
apply from: "${rootDir}/gradle/neoforge-band.gradle"
