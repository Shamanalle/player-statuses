plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '[7.0.80,7.1)'
}

// NeoForge 1.20.4: runs with Minecraft's own names and uses NeoForge's first CustomPacketPayload API.
def repoRoot = file('../../..')
def props = new Properties()
new File(repoRoot, 'gradle.properties').withInputStream { props.load(it) }

def neoforge = project.findProperty('loaderOverride') ?: props.getProperty('nf1204_neoforge')
def modVersion = props.getProperty('mod_version')

version = "${modVersion}+mc1.20.4"
group = props.getProperty('maven_group')

base {
    archivesName = 'player-statuses-neoforge'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

def ownRoot = file('src/main/java')
def sharedRoots = [
        "${repoRoot}/shared/mc-1.20.1/src/main/java",
        "${repoRoot}/shared/mc-all/src/main/java",
        "${repoRoot}/common/src/main/java",
].collect { new File(it) }
def excluded = [
        'com/kasper/playerstatuses/network/StatusPayload.java',
]

sourceSets {
    stubs {
        java.srcDir "${repoRoot}/common/src/stubs/java"
    }
    main {
        compileClasspath += stubs.output
        java {
            sharedRoots.each { srcDir it }
            exclude { FileTreeElement e ->
                if (e.directory) {
                    return false
                }
                def path = e.relativePath.pathString
                def index = sharedRoots.findIndexOf { e.file.path.startsWith(it.path + File.separator) }
                if (index < 0) {
                    return false
                }
                def before = [ownRoot] + sharedRoots.take(index)
                excluded.contains(path) || before.any { new File(it, path).exists() }
            }
        }
        resources {
            srcDir "${repoRoot}/common/src/main/resources"
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/mods.toml') {
        expand 'version': version
    }
    filesMatching('playerstatuses-build.properties') {
        expand 'version': modVersion
    }
}
