plugins {
    id 'fabric-loom' version '1.18.2'
    id 'java'
}

// Fabric / Quilt, Minecraft 1.20.5 - 1.20.6 (see gradle/fabric-band.gradle)
ext.fabricTarget = 'mc1.20.5-1.20.6'
ext.fabricKey = 'mc1206'
ext.fabricJava = 21
ext.fabricMinecraft = '>=1.20.5 <1.21'
ext.fabricRemap = true
ext.fabricShared = ['shared/fabric-1.21.1', 'shared/fabric', 'shared/mc-1.20.6', 'shared/mc-1.21.1', 'shared/mc-all']
ext.fabricExcluded = [
    'com/kasper/playerstatuses/mixin/AvatarRendererMixin.java'
]
apply from: "${rootDir}/gradle/fabric-band.gradle"
