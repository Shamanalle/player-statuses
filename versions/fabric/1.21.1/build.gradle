plugins {
    id 'fabric-loom' version '1.18.2'
    id 'java'
}

// Fabric / Quilt, Minecraft 1.21 - 1.21.1 (see gradle/fabric-band.gradle)
ext.fabricTarget = 'mc1.21-1.21.1'
ext.fabricKey = 'mc1211'
ext.fabricJava = 21
ext.fabricMinecraft = '>=1.21 <1.21.2'
ext.fabricRemap = true
ext.fabricShared = ['shared/fabric-1.21.1', 'shared/fabric', 'shared/mc-1.21.1', 'shared/mc-all']
ext.fabricExcluded = [
        'com/kasper/playerstatuses/mixin/AvatarRendererMixin.java',
]
apply from: "${rootDir}/gradle/fabric-band.gradle"
